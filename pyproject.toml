[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-bot"
version = "0.2.0"
description = "Production-grade quantitative spot trading daemon for Bitso BTC/MXN"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "requests>=2.31.0",
    "urllib3>=2.2.0",
    "websocket-client>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "types-requests>=2.31.0",
]

[project.scripts]
trading-bot = "trading_bot.application.runner:main"
rsi-updater = "trading_bot.adapters.indicators.cached_rsi:main"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "tests/test_phase1.py",
    "tests/test_phase3.py",
    "tests/test_risk.py",
    "tests/test_signals.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = []

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers --tb=short"
